[project]
name = "spatial-labour-trap"
version = "0.1.0"
description = "Spatially explicit agent-based model of job search frictions in a stylised South African city"
requires-python = ">=3.12"
dependencies = [
    "mesa==3.5.1",
    # mesa's own declared metadata lists only numpy/pandas/scipy/tqdm, but importing mesa
    # unconditionally pulls in mesa.discrete_space.network, which imports networkx -- an
    # undeclared runtime dependency in 3.5.1. Pinned explicitly so `pip install -e .` doesn't
    # break on a fresh clone the way the bare `pip install mesa` did here.
    "networkx==3.6.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
    "matplotlib==3.11.1",
    "pyyaml==6.0.3",
    "joblib==1.5.3",
    "pyreadstat==1.3.5",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "pre-commit==4.6.1",
    "nbstripout==0.9.1",
    "psutil==7.2.2",
    # ipykernel/nbconvert/nbclient run the moment notebooks headlessly. Deliberately not the
    # full `jupyter` metapackage -- it pulls in JupyterLab's static asset bundle, whose vendored
    # file paths exceed Windows' 260-character MAX_PATH and abort the install partway through.
    # Install jupyterlab yourself if you want the interactive UI; it's a personal tooling choice,
    # not a reproducibility requirement.
    "ipykernel==7.3.0",
    "nbconvert==7.17.1",
    "nbclient==0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: statistical/seed-sweep tests that take minutes, run locally not in CI",
]
addopts = "-ra"
testpaths = ["tests"]
