repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2 # matches pyproject.toml's pinned ruff==0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1 # matches pyproject.toml's pinned nbstripout==0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: no-microdata
        name: block restricted survey microdata
        entry: python tools/hooks/check_no_microdata.py
        language: system
        pass_filenames: false
        always_run: true

      - id: no-ai-attribution
        name: block AI-attribution trailers in commit messages
        entry: python tools/hooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
