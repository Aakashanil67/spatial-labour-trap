# Same parameters as configs/baseline.yaml, at a smaller N and a seed originally picked (by
# scanning seeds 1-14 and checking every agent's full state history) because agent 32 showed a
# clean discouragement/re-entry cycle.
#
# Re-verified twice as separation_rate moved: first (2026-08-16) from Miyamoto's fallback to
# Week 3's own 0.0317, then again (2026-08-17) from 0.0317 to the demographically-consistent
# 0.0296 (see DECISIONS.md, "The QLFS separation-rate linkage needed a demographic consistency
# check..."). Under the current economics, agent 32's exact state transitions (from
# model.trace_dataframe()) are: SEARCHING at step 1, DISCOURAGED at 6, EMPLOYED at 15,
# DISCOURAGED at 24, EMPLOYED at 34, DISCOURAGED at 78 (a long, roughly 44-step stable spell),
# EMPLOYED at 87, DISCOURAGED at 97, EMPLOYED at 107, DISCOURAGED at 111, EMPLOYED at 121,
# running employed to the end at step 150 -- five full discouragement/re-entry cycles and one
# long stable spell, still a clean demonstration that locked commitment 6 (discouragement is
# not absorbing) is actually implemented, not just asserted in a comment. Not re-scanned for a
# new seed/agent pair each time, since this one keeps producing a clear, compelling illustration
# of the same mechanism under every separation-rate revision so far.
#
# python -m src.diagnostics --config configs/trace_demo.yaml --trace-agent 32

n_agents: 200
n_vacancies: 15
initial_search_capital: 0.6
initial_capital_spread: 0.5
search_cost_per_trip: 0.02
separation_rate: 0.0296 # QLFS-panel central estimate, notebook 03 -- see DECISIONS.md
belief_multiplier: 1.0
household_inflow: 0.008
reentry_threshold: 0.035
max_trips_per_step: 3
n_steps: 150
seed: 5
shuffled_activation: true

grid_size: 40
cbd_radius: 2.0
n_townships: 4
township_distance_min: 8.0
township_distance_max: 20.0
township_spread: 2.0
transport_cost_rate: 0.004
n_distance_bands: 4

n_firms: 5
firm_radius: 2.5
firm_productivity: 1.2
firm_posting_cost: 0.1
firm_kappa: 0.9
discount_rate: 0.001332

rho_A: 0.849
sigma_A: 0.0057
burn_in_steps: 50

trace_agent_ids: [32]
