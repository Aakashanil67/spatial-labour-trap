# The half-day scarce-vacancy smoke test (sign-only, not the full Week 5 validation): does a
# small transport subsidy raise search intensity without raising employment, matching Banerjee
# and Sequeira (2023)? See configs/scarce_vacancies_subsidy.yaml for the treatment arm.
#
# Everything here is configs/baseline.yaml's own already-validated economics -- c_post, kappa,
# n_firms, rho_A and sigma_A are untouched, exactly as the plan specifies -- with n_agents
# raised from 500 to 18,000. That's the only deliberate lever: the AR(1) shock's calibrated
# amplitude (sigma_A=0.0057) turned out too small to ever move the vacancy count meaningfully
# (mean realised shock varies by under 0.3 percentage points across 30 seeds), so "a persistent
# low state of the AR(1) process" doesn't survive contact with the actual parameters -- see
# DECISIONS.md. Found by sweeping n_agents against a fixed 5-firm supply and tracking the fill
# ratio (matches / vacancies posted), not just labour market tightness (v/u): at 18,000 agents,
# firms fill essentially every vacancy they post -- vacancies are the binding constraint on
# hiring, not search effort, which is the actual condition the sign pattern needs.
#
# separation_rate matches baseline.yaml's own value (2026-08-16: the real QLFS-panel SA rate,
# not Miyamoto's fallback -- see DECISIONS.md's "third door" entry). Re-checked after that
# change: the fill ratio at 18,000 agents is still exactly 1.00, and theta is now even lower
# (0.013, was 0.19) since the lower expected_value_per_hire makes firms post far fewer
# vacancies overall -- the scarcity this config is built to demonstrate holds at least as well
# as it did before, not something this change happened to break.

n_agents: 18000
n_vacancies: 15
initial_search_capital: 0.6
initial_capital_spread: 0.5
search_cost_per_trip: 0.003 # rescaled 2026-08-19, see baseline.yaml / DECISIONS.md
separation_rate: 0.0296 # QLFS-panel central estimate, notebook 03 -- matches baseline.yaml
belief_multiplier: 1.0
household_inflow: 0.008
reentry_threshold: 0.035
max_trips_per_step: 3
n_steps: 150
seed: 42
shuffled_activation: true

grid_size: 40
cbd_radius: 2.0
n_townships: 4
township_distance_min: 8.0
township_distance_max: 20.0
township_spread: 2.0
transport_cost_rate: 0.000145 # rescaled 2026-08-19, see baseline.yaml / DECISIONS.md
n_distance_bands: 4

n_firms: 5
firm_radius: 2.5
firm_productivity: 1.2
firm_posting_cost: 0.1
firm_kappa: 0.9
discount_rate: 0.001332

rho_A: 0.849
sigma_A: 0.0057

burn_in_steps: 50
