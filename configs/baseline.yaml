# The Week 2 spatial baseline: real geography, endogenous firms, an AR(1) productivity shock.
# Parameters are illustrative, not calibrated -- calibration is Week 4. rho_A/sigma_A are
# Chen (2025)'s AR(1) rebased from quarterly to monthly; separation_rate is Week 3's own
# QLFS-panel-derived SA rate (notebook 03), not a foreign fallback -- see DECISIONS.md.
#
# Re-verified (2026-08-16), superseding the earlier (2026-08-12) note below the old
# separation_rate=0.0048 (Miyamoto's Japanese fallback): that value made
# expected_value_per_hire so large (~32.6) that the model saturated near full employment
# regardless of the other three free parameters, confirmed by sweeping firm_kappa across its
# entire calibration search box and finding it converges to essentially the same near-total-
# employment steady state everywhere in it. At the real SA rate, expected_value_per_hire drops
# to ~6.05 and the market settles into a genuinely moderate, persistent regime instead: roughly
# 1.6-3% unemployment and a substantial (~20%), persistent discouraged share, at this exact
# firm_kappa=0.9. See DECISIONS.md, "A third door into the same deadlock class..."
#
# Corrected again (2026-08-17), following an independent verification: the raw UQNO+PERSONNO
# QLFS linkage used to derive 0.0317 contained implausible matches (a household code reassigned
# to a different person reads as a spurious employment transition). Requiring stable recorded
# gender and a plausible age change across each matched pair gives a demographically-consistent
# central estimate of 0.0296 (unrounded 0.0295827815); 0.0317 (unrounded 0.0316956564) is kept
# as a documented upper robustness bound, not the value used here. See DECISIONS.md, "The QLFS
# separation-rate linkage needed a demographic consistency check, and the design variables
# needed auditing before trusting a plain bootstrap."

n_agents: 500
n_vacancies: 15 # only used to seed each firm's initial vacancy count; ignored after step 1
initial_search_capital: 0.6 # W0. Mean of the draw -- see initial_capital_spread below
initial_capital_spread: 0.5 # coefficient of variation, lognormal -- prompt 3.1
search_cost_per_trip: 0.003 # c -- flat/base component; anchored to Banerjee and Sequeira
# (2023)'s ZAR 12.50 Soweto-CBD return fare in wage units, see transport_cost_rate below and
# DECISIONS.md, "The spatial money scale was never rebased into wage units"
separation_rate: 0.0296 # lambda, monthly -- QLFS-panel central estimate, notebook 03; see DECISIONS.md
belief_multiplier: 1.0 # beta = 1.0 is the unbiased baseline
household_inflow: 0.008 # g
reentry_threshold: 0.035
max_trips_per_step: 3
n_steps: 150
seed: 42
shuffled_activation: true

# Spatial grid
grid_size: 40
cbd_radius: 2.0
n_townships: 4
township_distance_min: 8.0
township_distance_max: 20.0
township_spread: 2.0
transport_cost_rate: 0.000145 # rand per grid-unit distance per trip, on top of
# search_cost_per_trip. Rebased 2026-08-19: Banerjee and Sequeira (2023) report ZAR 500 buying
# 40 return tickets between Soweto and Johannesburg CBD (R12.50/return trip) over a route they
# describe as "at least 20 km" -- close enough to this config's own township_distance_max=20
# to read a grid unit as one km directly, with no separate invented mapping constant. Converted
# to wage units via this project's own NHTS-notebook median monthly wage (R4,300, reproduced
# directly against the microdata, not assumed): (12.50 / 20) / 4300 = 0.0001454, rounded. The
# old 0.004 was set when the grid was built and never checked against data -- at the corrected
# calibration optimum it made one search trip's distance component alone cost 1.01 wage-days
# against an empirical target of 0.1058. See DECISIONS.md, "The spatial money scale was never
# rebased into wage units".
n_distance_bands: 4

# Endogenous firms (M4)
n_firms: 5
firm_radius: 2.5 # rho
firm_productivity: 1.2 # p
firm_posting_cost: 0.1 # c_post
firm_kappa: 0.9 # posting sensitivity
discount_rate: 0.001332 # r, monthly -- rebased from Chen (2025)'s quarterly 0.004

# AR(1) productivity shock (M2), rebased monthly from Chen (2025) Table 1 -- see DECISIONS.md
rho_A: 0.849
sigma_A: 0.0057

# Moments (src/moments.py). The cold-start transient documented in DECISIONS.md settles by
# roughly step 50 -- confirmed against this exact config's diagnostics figure -- so the first
# 50 steps are excluded from every time-averaged moment.
burn_in_steps: 50
