# The Week 2 spatial baseline: real geography, endogenous firms, an AR(1) productivity shock.
# Parameters are illustrative, not calibrated -- calibration is Week 4. rho_A/sigma_A are
# Chen (2025)'s AR(1) rebased from quarterly to monthly; separation_rate is Week 3's own
# QLFS-panel-derived SA rate (notebook 03), not a foreign fallback -- see DECISIONS.md.
#
# Re-verified (2026-08-16), superseding the earlier (2026-08-12) note below the old
# separation_rate=0.0048 (Miyamoto's Japanese fallback): that value made
# expected_value_per_hire so large (~32.6) that the model saturated near full employment
# regardless of the other three free parameters, confirmed by sweeping firm_kappa across its
# entire calibration search box and finding it converges to essentially the same near-total-
# employment steady state everywhere in it. At the real SA rate, expected_value_per_hire drops
# to ~6.05 and the market settles into a genuinely moderate, persistent regime instead: roughly
# 1.6-3% unemployment and a substantial (~20%), persistent discouraged share, at this exact
# firm_kappa=0.9. See DECISIONS.md, "A third door into the same deadlock class..."

n_agents: 500
n_vacancies: 15 # only used to seed each firm's initial vacancy count; ignored after step 1
initial_search_capital: 0.6 # W0. Mean of the draw -- see initial_capital_spread below
initial_capital_spread: 0.5 # coefficient of variation, lognormal -- prompt 3.1
search_cost_per_trip: 0.02 # c -- flat/base component, see transport_cost_rate
separation_rate: 0.0317 # lambda, monthly -- QLFS-panel SA rate, notebook 03; see DECISIONS.md
belief_multiplier: 1.0 # beta = 1.0 is the unbiased baseline
household_inflow: 0.008 # g
reentry_threshold: 0.035
max_trips_per_step: 3
n_steps: 150
seed: 42
shuffled_activation: true

# Spatial grid
grid_size: 40
cbd_radius: 2.0
n_townships: 4
township_distance_min: 8.0
township_distance_max: 20.0
township_spread: 2.0
transport_cost_rate: 0.004 # rand per grid-unit distance per trip, on top of search_cost_per_trip
n_distance_bands: 4

# Endogenous firms (M4)
n_firms: 5
firm_radius: 2.5 # rho
firm_productivity: 1.2 # p
firm_posting_cost: 0.1 # c_post
firm_kappa: 0.9 # posting sensitivity
discount_rate: 0.001332 # r, monthly -- rebased from Chen (2025)'s quarterly 0.004

# AR(1) productivity shock (M2), rebased monthly from Chen (2025) Table 1 -- see DECISIONS.md
rho_A: 0.849
sigma_A: 0.0057

# Moments (src/moments.py). The cold-start transient documented in DECISIONS.md settles by
# roughly step 50 -- confirmed against this exact config's diagnostics figure -- so the first
# 50 steps are excluded from every time-averaged moment.
burn_in_steps: 50
